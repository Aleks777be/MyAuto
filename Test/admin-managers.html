<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Управление менеджерами</title>
    <link rel="stylesheet" href="admin-managers.css">
</head>
<body>
    <div class="admin-container">
        <!-- Шапка -->
        <div class="header">
            <h1>📊 Админ-панель - Управление менеджерами</h1>
            <div class="user-info">
                <span id="currentUser">Администратор</span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>
        
        <!-- Основное содержимое -->
        <div class="content">
            <!-- Сообщение об ошибке -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Форма добавления менеджера -->
            <div class="add-form">
                <h2 class="section-title">➕ Добавить нового менеджера</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="login">Логин *</label>
                        <input type="text" id="login" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль *</label>
                        <input type="password" id="password" placeholder="Введите пароль">
                    </div>
                    <div class="form-group">
                        <label for="full_name">ФИО *</label>
                        <input type="text" id="full_name" placeholder="Иванов Иван Иванович">
                    </div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="is_admin">
                    <label for="is_admin">Назначить администратором</label>
                </div>
                <button class="btn-add" onclick="addManager()">Добавить менеджера</button>
            </div>
            
            <!-- Список менеджеров -->
            <h2 class="section-title">👥 Список менеджеров</h2>
            <div class="table-container">
                <div class="loading" id="loading">Загрузка данных...</div>
                <table id="managersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>ФИО</th>
                            <th>Роль</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Данные будут заполнены JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно сброса пароля -->
    <div class="modal" id="resetPasswordModal">
        <div class="modal-content">
            <h3>🔄 Сброс пароля</h3>
            <p>Для менеджера: <strong id="resetManagerName"></strong></p>
            <input type="password" id="newPassword" class="modal-input" placeholder="Новый пароль">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeResetModal()">Отмена</button>
                <button class="btn-confirm" onclick="confirmResetPassword()">Сбросить</button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        const API_URL = 'http://localhost:3001';
        let currentManagerId = null;
        let managers = [];
        
        // Проверка авторизации при загрузке
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (!token || !user) {
                redirectToLogin();
                return;
            }
            
            try {
                const userData = JSON.parse(user);
                document.getElementById('currentUser').textContent = userData.login;
                
                // Проверяем что пользователь админ
                if (!userData.is_admin) {
                    showError('Только администраторы могут управлять менеджерами');
                    setTimeout(() => redirectToMain(), 3000);
                    return;
                }
                
                await loadManagers();
            } catch (error) {
                console.error('Ошибка:', error);
                redirectToLogin();
            }
        });
        
        // Загрузка списка менеджеров
        async function loadManagers() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/managers`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 403) {
                        showError('Доступ запрещен. Требуются права администратора');
                    } else {
                        throw new Error('Ошибка загрузки данных');
                    }
                    return;
                }
                
                managers = await response.json();
                renderManagers();
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showError('Не удалось загрузить список менеджеров');
            }
        }
        
        // Отображение менеджеров в таблице
        function renderManagers() {
            const tbody = document.querySelector('#managersTable tbody');
            const loading = document.getElementById('loading');
            
            loading.style.display = 'none';
            
            if (managers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 30px; color: #7f8c8d;">Нет менеджеров</td></tr>`;
                return;
            }
            
            tbody.innerHTML = managers.map(manager => `
                <tr>
                    <td>${manager.id}</td>
                    <td>${manager.login}</td>
                    <td>${manager.full_name || '-'}</td>
                    <td>
                        <span class="role-badge ${manager.is_admin ? 'role-admin' : 'role-manager'}">
                            ${manager.is_admin ? 'Администратор' : 'Менеджер'}
                        </span>
                    </td>
                    <td>
                        <div class="actions">
                            <button class="btn-action btn-reset" onclick="openResetModal(${manager.id}, '${manager.login}')">
                                🔄 Сбросить пароль
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteManager(${manager.id}, '${manager.login}')" ${manager.is_admin ? 'disabled style="opacity: 0.5;"' : ''}>
                                ❌ Удалить
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        
        // Добавление нового менеджера
        async function addManager() {
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('full_name').value.trim();
            const is_admin = document.getElementById('is_admin').checked;
            
            if (!login || !password || !full_name) {
                showError('Заполните все обязательные поля');
                return;
            }
            
            if (password.length < 6) {
                showError('Пароль должен быть не менее 6 символов');
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/managers`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        login,
                        password,
                        full_name,
                        is_admin
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    showError(error.message || 'Ошибка добавления менеджера');
                    return;
                }
                
                // Очищаем форму
                document.getElementById('login').value = '';
                document.getElementById('password').value = '';
                document.getElementById('full_name').value = '';
                document.getElementById('is_admin').checked = false;
                
                // Обновляем список
                await loadManagers();
                showError('', false); // скрываем ошибку
                
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось добавить менеджера');
            }
        }
        
        // Открытие модального окна сброса пароля
        function openResetModal(id, login) {
            currentManagerId = id;
            document.getElementById('resetManagerName').textContent = login;
            document.getElementById('newPassword').value = '';
            document.getElementById('resetPasswordModal').style.display = 'flex';
        }
        
        // Закрытие модального окна
        function closeResetModal() {
            document.getElementById('resetPasswordModal').style.display = 'none';
            currentManagerId = null;
        }
        
        // Подтверждение сброса пароля
        async function confirmResetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            
            if (!newPassword || newPassword.length < 6) {
                showError('Пароль должен быть не менее 6 символов');
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/managers/${currentManagerId}/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        new_password: newPassword
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    showError(error.message || 'Ошибка сброса пароля');
                    return;
                }
                
                closeResetModal();
                showError('Пароль успешно сброшен', false);
                
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось сбросить пароль');
            }
        }
        
        // Удаление менеджера
        async function deleteManager(id, login) {
            if (!confirm(`Вы уверены, что хотите удалить менеджера "${login}"?`)) {
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/managers/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    showError(error.message || 'Ошибка удаления менеджера');
                    return;
                }
                
                await loadManagers();
                showError('Менеджер успешно удален', false);
                
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось удалить менеджера');
            }
        }
        
        // Показ ошибок
        function showError(message, isError = true) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = message ? 'block' : 'none';
            errorElement.style.background = isError ? '#ffeaa7' : '#d1f7c4';
            errorElement.style.color = isError ? '#d35400' : '#27ae60';
            
            if (message && !isError) {
                setTimeout(() => errorElement.style.display = 'none', 3000);
            }
        }
        
        // Выход из системы
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            redirectToLogin();
        }
        
        // Перенаправление на страницу логина
        function redirectToLogin() {
            window.location.href = 'AuthorizationMA.html';
        }
        
        // Перенаправление на главную
        //function redirectToMain() {
         //   window.location.href = 'testwt.html';
        //}
        
        // Закрытие модального окна по клику вне его
        window.onclick = function(event) {
            const modal = document.getElementById('resetPasswordModal');
            if (event.target === modal) {
                closeResetModal();
            }
        };
    </script>
</body>
</html>
